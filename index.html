<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="./css/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Text:wght@300..700&display=swap"
          rel="stylesheet">

    <title>Shopping - Product List</title>
</head>
<body class="bg-vanillaCream">
    <div
            class="flex flex-col items-center justify-center gap-[30px] px-[30px] py-[30px]
            md:flex-row md:justify-center md:items-start">
        <!-- Product List -->
        <section class="flex flex-col gap-12 basis-2/3 grow max-w-[798px]">
            <h2 class="text-4xl font-bold text-darkBrown">Desserts</h2>

            <!-- Product List container -->
            <div class="grid grid-cols-1 md:grid-cols-3 gap-9">
                <!--Product 1 -->
                <div class="relative">
                    <img src="./images/image-waffle-desktop.jpg" alt="product"
                         class="w-full rounded-xl" />

                    <button class="absolute addBtn -bottom-5 inset-x-0 mx-auto w-max">
                        Add to Cart
                        <img src="./images/icon-add-to-cart.svg" alt="addToCart"
                             class="w-[16px] h-[16px]" />
                    </button>
                </div>

                <!--Product 2 -->
                <div class="relative">

                        <img src="./images/icon-add-to-cart.svg" alt="addToCart"

                    </button>
                </div>

                </div>

                        <img src="./images/icon-add-to-cart.svg" alt="addToCart"

                    </button>
                </div>

                <!--Product 7 -->
                <div class="relative">
                    <img src="./images/image-cake-desktop.jpg" alt="product"

                    <button class="absolute addBtn -bottom-5 inset-x-0 mx-auto w-max">

                        <img src="./images/icon-add-to-cart.svg" alt="addToCart"

                </div>

                <!--Product 8 -->

                             class="w-[16px] h-[16px]" />
                    </button>
                </div>
            </div>
        </section>

        <!-- Cart -->
        <section class="flex basis-1/3 flex-none max-w-[306px]">
            <!-- Empty Cart -->
            <div class="bg-white rounded-xl px-8 py-8 w-full">
                <h3 class="text-2xl font-bold text-orange mb-4">
                    Your Cart (0)
                    <!-- TODO: Products in card counter logic -->
                </h3>

                <!-- Empty Cart Content -->
                <div class="flex flex-col items-center justify-center gap-4">
                    <img src="./images/illustration-empty-cart.svg" alt="empty-cart"
                         class="w-[112px] h-[99px]">

                    <p class="text-xs font-bold text-taupeGray">Your added items will appear
                        here</p>
                </div>

                <!-- TODO: Products in card statement -->
            </div>
        </section>
