<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="./css/style.css">
    <title>Tailwind</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
            href="https://fonts.googleapis.com/css2?family=Alata&family=Josefin+Sans:wght@300&display=swap"
            rel="stylesheet">
</head>
<body>
    <!-- Hero Section -->
    <section id="hero">
        <!--Hero Container-->
        <div class="container max-w-6xl mx-auto px-6 py-12">
            <!--Menu/Logo Container-->
            <nav class="flex items-center justify-between font-bold text-white">
                <img src="images/logo.svg" alt="logo">
                <!--Menu-->
                <div class="hidden h-10 font-alata md:flex md:space-x-8">
                    <div class="group">
                        <a href="#">About</a>
                        <div class="mx-2 group-hover:border-b group-hover:border-blue-50"></div>
                    </div>

                    <div class="group">
                        <a href="#">Careers</a>
                        <div class="mx-2 group-hover:border-b group-hover:border-blue-50"></div>
                    </div>

                    <div class="group">
                        <a href="#">Events</a>
                        <div class="mx-2 group-hover:border-b group-hover:border-blue-50"></div>
                    </div>

                    <div class="group">
                        <a href="#">Products</a>
                        <div class="mx-2 group-hover:border-b group-hover:border-blue-50"></div>
                    </div>

                    <div class="group">
                        <a href="#">Support</a>
                        <div class="mx-2 group-hover:border-b group-hover:border-blue-50"></div>
                    </div>
                </div>

                <!--@TODO: Hamburger Button -->
            </nav>

            <!--@TODO: Mobile Menu -->
            <div class="max-w-lg mt-32 mb-32 p-4 font-sans text-4xl text-white uppercase border-2 md:p-10md:m-32 md:mx-0 md:text-6xl">
                Impressive Experiences That Deliver
            </div>
        </div>
    </section>
</body>
</html>
