<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="./css/style.css">
    <title>Meet Landing Page</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:ital,wght@0,300..900;1,300..900&display=swap"
          rel="stylesheet">

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="./images/favicon-32x32.png">
</head>
<body class="bg-white">
    <main>
        <section class="flex flex-col items-center justify-center mt-20">
            <img src="./images/logo.svg" alt="logo"
                 class="flex items-center justify-center w-[118px] h-[28px]"/>

            <!-- Desktop only -->
            <section class="hidden lg:flex justify-between items-center w-full mt-20">
                <img src="./images/desktop/image-hero-left.png"
                     alt="image-hero-left"
                     class="w-full max-w-[300px] h-auto object-contain"/>

                <div class="flex flex-col gap-8 text-center max-w-[448px]">
                    <h1 class="text-preset-1 font-bold text-slate-900">Group Chat for Everyone</h1>

                    <p class="text-preset-4 text-slate-600">Meet makes it easy to connect with
                        others face-to-face
                        virtually and
                        collaborate across any device.</p>

                    <!-- Buttons -->
                    <div class="hidden lg:flex flex-row gap-4 items-center justify-center">
                        <button class="btn bg-cyan-600 hover:bg-cyan-400">
                            Download
                            <span class="ml-1 text-cyan-300">v1.3</span>
                        </button>

                        <button class="btn bg-purple-600 hover:bg-purple-400">
                            What is it?
                        </button>
                    </div>
                </div>

                <img src="./images/desktop/image-hero-right.png"
                     alt="image-hero-right"
                     class="w-full max-w-[300px] h-auto object-contain"/>
            </section>

            <!-- Tablet & Mobile only -->
            <section
                    class="flex flex-col gap-[72px] items-center justify-center w-full mt-10 px-6 lg:hidden">
                <img src="./images/tablet/image-hero.png"
                     alt="image-hero"
                     class="w-full h-auto object-contain mb-6"/>

                <div class="flex flex-col gap-6 text-center max-w-[448px]">
                    <h1 class="text-tablet-preset-1 font-bold text-slate-900">
                        Group Chat for Everyone
                    </h1>

                    <p class="tablet-text-preset-4 text-slate-600">Meet makes it easy to connect
                        with
                        others face-to-face
                        virtually and
                        collaborate across any device.</p>

                    <!-- Buttons -->
                    <div class="flex lg:hidden flex-col gap-4 items-center justify-center">
                        <button class="btn bg-cyan-600 hover:bg-cyan-400">
                            Download
                            <span class="ml-1 text-cyan-300">v1.3</span>
                        </button>

                        <button class="btn bg-purple-600 hover:bg-purple-400">
                            What is it?
                        </button>
                    </div>
                </div>
            </section>
        </section>

        <!-- Step indicator  -->
        <section class="step-indicator">
            <div class="step-indicator-line"></div>
            <div class="step-indicator-circle">
                <span class="step-indicator-number">01</span>
            </div>
        </section>
    </main>

    <!-- TODO: footer should be here -->
    <footer></footer>
</body>
</html>
