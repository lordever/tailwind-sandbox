<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="./css/style.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400..900&display=swap"
          rel="stylesheet">

    <title>QR Code</title>
</head>
<body class="bg-slate-300">
    <section class="flex justify-center h-screen items-center">
        <!-- Card -->
        <div class="flex flex-col bg-white px-4 pt-4 pb-10 rounded-2xl gap-6 max-w-[320px]">
            <img src="./images/image-qr-code.png" alt="qrCode" class="max-w-[288px] rounded-xl">

            <div class="flex flex-col text-center gap-4 px-2">
                <h3 class="text-2xl font-bold text-slate-900">
                    Improve your front-end skills by building projects
                </h3>

                <p class="text-sm text-slate-500">Scan the QR code to visit Frontend Mentor and
                    take your
                    coding
                    skills to
                    the next level</p>
            </div>
        </div>
    </section>
</body>
</html>
