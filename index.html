<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">
    <link rel="stylesheet" href="./css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bai+Jamjuree:ital,wght@0,200;0,300;0,400;0,500;0,600;0,700;1,200;1,300;1,400;1,500;1,600;1,700&family=Barlow+Semi+Condensed:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Tapestry&display=swap"
          rel="stylesheet">
    <title>Tailwind</title>
</head>
<body>
    <!-- Hero Section -->
    <section id="hero">
        <div class="max-w-6xl mx-auto text-center mb-40 px-10 pt-60">
            <img src="./images/logo.svg" alt="logo" class="mx-auto my-16"/>

            <h3 class="mb-8 text-4xl font-bold text-darkGrayishBlue md:text-5xl">
                A history of everything you copy
            </h3>

            <p class="max-w-3xl mx-auto mb-10 text-2xl text-grayishBlue">
                Clipboard allows you to track and organize everything you copy.
                Instantly access your clipboard on all your devices.
            </p>


            <!-- Button Container -->
            <div class="flex flex-col justify-center w-full space-y-6 text-xl text-white md:flex-row md:space-y-0 md:space-x-4">
                <a href="#"
                   class="p-4 px-8 rounded-full shadow-lg bg-strongCyan duration-200 hover:opacity-80">
                    Download for iOS
                </a>
                <a href="#"
                   class="p-4 px-8 rounded-full shadow-lg bg-lightBlue duration-200 hover:opacity-80">
                    Download for Mac
                </a>
            </div>
        </div>
    </section>
</body>
</html>
