<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8"/>
    <meta http-equiv="X-UA-Compatible" content="IE=edge"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <link
            href="https://fonts.googleapis.com/css2?family=Mulish:wght@300;400;500;600;700&family=Rokkitt:wght@600;700&display=swap"
            rel="stylesheet"
    />
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Login Modal</title>

    <script>
        tailwind.config = {
            theme: {
                fontFamily: {
                    sans: ['Mulish', 'sans-serif'],
                    mono: ['Rokkitt', 'monospace']
                }
            }
        }
    </script>
</head>
<body>
    <!--Background container-->
    <div class="flex items-center justify-center min-h-screen bg-rose-50">
        <!--Card container-->
        <div class="relative flex flex-col m-6 space-y-10 bg-white shadow-2xl rounded-2xl
                    md:flex-row md:space-y-0 md:m-0">
            <!--Left container-->
            <div class="p-6 md:p-20">
                <h2 class="font-mono text-4xl font-bold mb-5">Log In</h2>
                <p class="max-w-sm mb-12 font-sans font-light text-gray-500">
                    Log in to your account to upload or
                    download
                    pictures,
                    videos or music.
                </p>
                <input type="text"
                       class="w-full p-6 mb-5 border border-gray-300 rounded-md
                       placeholder:font-sans placeholder:font-light"
                       placeholder="Enter your email address"/>

                <div
                        class="flex flex-col items-center justify-between space-y-6 pb-12 border-b
                        border-gray-300 mb-5 md:flex-row md:space-y-0">
                    <a href="#" class="text-cyan-700 font-thin">Forgot password</a>
                    <button
                            class="w-full md:w-auto flex justify-center items-center p-6 bg-cyan-700
                            rounded-md text-white space-x-4 font-sans font-bold px-9
                            shadow-cyan-100 hover:bg-opacity-90 shadow-sm hover:shadow-lg">
                        <span>Next</span>
                        <svg
                                xmlns="http://www.w3.org/2000/svg"
                                class="w-7"
                                viewBox="0 0 24 24"
                                stroke-width="1.5"
                                stroke="#ffffff"
                                fill="none"
                                stroke-linecap="round"
                                stroke-linejoin="round"
                        >
                            <path stroke="none" d="M0 0h24v24H0z" fill="none"/>
                            <line x1="5" y1="12" x2="19" y2="12"/>
                            <line x1="13" y1="18" x2="19" y2="12"/>
                            <line x1="13" y1="6" x2="19" y2="12"/>
                        </svg>
                    </button>
                </div>

                <div class="flex items-center justify-center mb-5">
                    <p class="font-small font-sans font-light text-gray-500">or log in with</p>
                </div>

                <div class="flex items-center flex-col justify-between space-y-2 md:flex-row md:space-x-2 md:space-y-0">
                    <button
                            class="w-full md:w-auto flex justify-center items-center p-3 bg-white border border-gray-300
                            rounded-md space-x-3 font-sans px-9 shadow-sm hover:shadow-md transition
                            duration-200 hover:-translate-y-0.5">
                        <img src="images/facebook.png" alt="" class="w-9"/>
                        <span>Facebook</span>
                    </button>
                    <button
                            class="w-full md:w-auto flex justify-center items-center p-3 bg-white border border-gray-300
                            rounded-md space-x-3 font-sans px-9 shadow-sm hover:shadow-md transition
                            duration-200 hover:-translate-y-0.5">
                        <img src="images/google.png" alt="" class="w-9"/>
                        <span>Google</span>
                    </button>
                </div>
            </div>

            <img src="images/image.jpg" alt="image" class="w-[430px] hidden md:block">

            <div
                    class="group absolute -top-5 right-4 bg-gray-200 p-2 rounded-full cursor-pointer
                    transition duration-150 hover:-translate-y-0.5 md:bg-white md:top-4">
                <svg
                        xmlns="http://www.w3.org/2000/svg"
                        class="w-6 h-6 text-black group-hover:text-gray-600"
                        viewBox="0 0 24 24"
                        stroke-width="1.5"
                        stroke="currentColor"
                        fill="none"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                >
                    <path stroke="none" d="M0 0h24v24H0z" fill="none" />
                    <line x1="18" y1="6" x2="6" y2="18" />
                    <line x1="6" y1="6" x2="18" y2="18" />
                </svg>
            </div>
        </div>
    </div>
</body>
</html>
